<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="xr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5dade2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Globe icon with digital twin grid -->
  <circle cx="35" cy="35" r="28" fill="url(#xr-grad)" opacity="0.1"/>
  <circle cx="35" cy="35" r="25" fill="none" stroke="url(#xr-grad)" stroke-width="2" filter="url(#glow)"/>
  <ellipse cx="35" cy="35" rx="18" ry="25" fill="none" stroke="url(#xr-grad)" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="35" cy="35" rx="25" ry="12" fill="none" stroke="url(#xr-grad)" stroke-width="1.5" opacity="0.8"/>
  <line x1="10" y1="35" x2="60" y2="35" stroke="url(#xr-grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="10" x2="35" y2="60" stroke="url(#xr-grad)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- XR indicator -->
  <circle cx="58" cy="18" r="5" fill="#f39c12" filter="url(#glow)"/>
  <circle cx="58" cy="52" r="5" fill="#f39c12" filter="url(#glow)"/>
  
  <!-- "Digital Twins + GeoAI" -->
  <text x="75" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#xr-grad)">DigiTwin XR</text>
  
  <!-- Tagline line -->
  <line x1="75" y1="38" x2="265" y2="38" stroke="url(#xr-grad)" stroke-width="1" opacity="0.4"/>
  
  <!-- "SIOS" badge -->
  <rect x="250" y="20" width="25" height="18" rx="3" fill="url(#accent-grad)" opacity="0.9"/>
  <text x="262" y="33" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">SIOS</text>
  
  <!-- Subtitle -->
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="10" fill="#666666">Digital Twins + GeoAI + Infrastructure Intelligence for Southern Africa</text>
</svg>